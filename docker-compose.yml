version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: placement_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: placement_prep
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placement_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: placement_prep
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysqldb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
