# H2 In-Memory Database Configuration for Unit Tests & CI/CD Pipelines
spring.datasource.url=jdbc:h2:mem:placement_prep_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT Security Configuration for Testing
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=900000
jwt.refresh-expiration=604800000

# File Upload Test Directory
file.upload-dir=uploads
aws.s3.enabled=false
